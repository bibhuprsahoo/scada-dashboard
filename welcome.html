<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  background:linear-gradient(135deg,#0d2b4e 0%,#16457c 50%,#1c5a9e 100%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;
  font-family:'Segoe UI',system-ui,sans-serif;color:#fff;text-align:center}
.logo{height:90px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(0,0,0,.3))}
h1{font-size:52px;font-weight:800;letter-spacing:-.5px;line-height:1.2;
   text-shadow:0 2px 12px rgba(0,0,0,.3)}
h1 span{color:#7db4e8}
p{font-size:22px;color:rgba(255,255,255,.7);font-weight:400;letter-spacing:.5px;text-transform:uppercase}
.line{width:80px;height:4px;background:#7db4e8;border-radius:2px}
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="BAMUL">
<div class="line"></div>
<div>
  <p>Welcome to the</p>
  <h1>Executive <span>Dashboard</span></h1>
</div>
<div class="line"></div>
<p style="font-size:16px;margin-top:8px">Bangalore Urban, Rural &amp; Ramanagara District Co-operative Milk Union Ltd.</p>
</body>
</html>
