<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Your Dashboard with Mojro Iframe</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f7f6;
            }
            .dashboard-header {
                background-color: #333;
                color: white;
                padding: 15px;
                text-align: center;
            }
            .iframe-container {
                width: 100%;
                height: calc(
                    100vh - 60px
                ); /* Adjust based on your header height */
                padding: 20px;
                box-sizing: border-box;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
        </style>
    </head>
    <body>
        <div class="iframe-container">
            <!-- The Mojro Shipper iFrame -->
            <iframe
                id="mojroIframe"
                src="https://shipper.mojro.com/embedded"
                title="Mojro Shipper Dashboard"
            >
            </iframe>
        </div>

        <!-- Script to handle communication -->
        <script src="script.js"></script>
    </body>
</html>
