<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMUL Pre-Dairy Slideshow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d2b4e}
.scene{position:fixed;inset:0;perspective:2000px}
.card{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.4,0,.2,1);
}
.card.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.face.back{transform:rotateY(180deg)}
iframe{width:100%;height:100%;border:none;display:block}
</style>
</head>
<body>
<div class="scene">
  <div class="card" id="card">
    <div class="face front"><iframe id="ifA"></iframe></div>
    <div class="face back"><iframe id="ifB"></iframe></div>
  </div>
</div>
<script>
const BASE = 'https://bangalore-dairy.duckdns.org';
const PAGES = [
  BASE + '/welcome.html',
  'https://friend-publishing-bottom-knife.trycloudflare.com/dashboard?union=bangalore&period=yesterday',
  BASE + '/bangalore-dairy-dashboard.html?filter=yesterday',
  BASE + '/predairy/union-summary.html',
  BASE + '/predairy/index.html',
  BASE + '/predairy/procurement.html',
  BASE + '/predairy/digital.html',
  BASE + '/predairy/farmers.html',
];
const DURATIONS = [5000,15000,15000,15000,15000,15000,15000,15000];

try { localStorage.setItem('predairy_filter', JSON.stringify({basis:'daily'})); } catch(e) {}

const DURATION = 15000;
const card = document.getElementById('card');
const ifA  = document.getElementById('ifA');
const ifB  = document.getElementById('ifB');

let current = 0;
let flipped = false;

// Start loading iframes immediately — don't wait for login
ifA.src = PAGES[0];
ifB.src = PAGES[1];

// Login in parallel
const FRAPPE = 'https://friend-publishing-bottom-knife.trycloudflare.com';
fetch(FRAPPE + '/api/method/login', {
  method: 'POST',
  credentials: 'include',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({usr: 'test@gmail.com', pwd: 'frappe123'})
}).catch(()=>{});

// Auto fullscreen
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.documentElement.requestFullscreen().catch(()=>{}), 500);
});
document.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
}, {once:true});

function next() {
  current = (current + 1) % PAGES.length;
  const nextIdx = (current + 1) % PAGES.length;
  flipped = !flipped;
  card.classList.toggle('flip', flipped);
  setTimeout(() => {
    if (flipped) ifA.src = PAGES[nextIdx];
    else         ifB.src = PAGES[nextIdx];
  }, 900);
  setTimeout(next, DURATIONS[current] || 15000);
}

setTimeout(next, DURATIONS[0]);
</script>
</body>
</html>
