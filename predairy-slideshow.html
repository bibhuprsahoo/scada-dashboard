<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMUL Pre-Dairy Slideshow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d2b4e}
.frame-wrap{position:fixed;inset:0}
iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;
  transition:opacity .6s ease;
  opacity:1;
}
iframe.hidden{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<div class="frame-wrap" id="frameWrap"></div>
<script>
const BASE = 'https://bangalore-dairy.duckdns.org';
const PAGES = [
  { src: BASE + '/predairy/union-summary.html' },
  { src: BASE + '/predairy/index.html' },
  { src: BASE + '/predairy/procurement.html' },
  { src: BASE + '/predairy/digital.html' },
  { src: BASE + '/predairy/farmers.html' },
];

try { localStorage.setItem('predairy_filter', JSON.stringify({basis:'monthly'})); } catch(e) {}

const DURATION = 15000;
let current = 0, startTime = null, rafId = null;

// Auto fullscreen on load
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => { document.documentElement.requestFullscreen().catch(()=>{}); }, 500);
});
document.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
}, { once: true });

// Build iframes
const wrap = document.getElementById('frameWrap');
const frames = PAGES.map((p, i) => {
  const f = document.createElement('iframe');
  f.src = p.src;
  f.className = i === 0 ? '' : 'hidden';
  wrap.appendChild(f);
  return f;
});

function goTo(idx) {
  cancelAnimationFrame(rafId);
  const prev = current;
  current = (idx + PAGES.length) % PAGES.length;
  frames[prev].classList.add('hidden');
  frames[current].classList.remove('hidden');
  startTime = performance.now();
  tick();
}

function tick() {
  if (performance.now() - startTime >= DURATION) { goTo(current + 1); }
  else { rafId = requestAnimationFrame(tick); }
}

startTime = performance.now();
tick();
</script>
</body>
</html>
