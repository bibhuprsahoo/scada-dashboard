<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMUL Pre-Dairy Slideshow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d2b4e}
#overlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity .4s ease}
.frame-wrap{position:fixed;inset:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
iframe.hidden{display:none}
</style>
</head>
<body>
<div id="overlay"></div>
<div class="frame-wrap" id="frameWrap"></div>
<script>
const BASE = 'https://bangalore-dairy.duckdns.org';
const PAGES = [
  { src: BASE + '/predairy/union-summary.html' },
  { src: BASE + '/predairy/index.html' },
  { src: BASE + '/predairy/procurement.html' },
  { src: BASE + '/predairy/digital.html' },
  { src: BASE + '/predairy/farmers.html' },
];

try { localStorage.setItem('predairy_filter', JSON.stringify({basis:'monthly'})); } catch(e) {}

const DURATION = 15000;
let current = 0, startTime = null, rafId = null;

// Auto fullscreen on load
document.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
}, { once: true });
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.documentElement.requestFullscreen().catch(()=>{});
  }, 500);
});

// Build iframes
const wrap = document.getElementById('frameWrap');
const frames = PAGES.map((p, i) => {
  const f = document.createElement('iframe');
  f.src = p.src;
  f.className = i === 0 ? '' : 'hidden';
  // hide topbar inside each iframe via postMessage or CSS injection
  f.onload = () => {
    try {
      f.contentDocument.querySelector('.topbar') && (f.contentDocument.querySelector('.topbar').style.display='none');
    } catch(e) {}
  };
  wrap.appendChild(f);
  return f;
});

const overlay = document.getElementById('overlay');

function goTo(idx) {
  cancelAnimationFrame(rafId);
  const prev = current;
  current = (idx + PAGES.length) % PAGES.length;
  overlay.style.opacity = '1';
  setTimeout(() => {
    frames[prev].className = 'hidden';
    frames[current].className = '';
    overlay.style.opacity = '0';
  }, 400);
  startTime = performance.now();
  tick();
}

function tick() {
  const elapsed = performance.now() - startTime;
  if (elapsed >= DURATION) { goTo(current + 1); }
  else { rafId = requestAnimationFrame(tick); }
}

startTime = performance.now();
tick();
</script>
</body>
</html>
