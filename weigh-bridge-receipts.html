<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weigh Bridge — Bangalore Main Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;
  --blue-deep:#1D4ED8;
  --blue-ink:#0B1B3F;
  --milk:#F5F8FF;
  --sky:#E8EFFD;
  --sky-line:#D5E2FA;
  --card:#FFFFFF;
  --text:#233355;
  --muted:#6B7CA3;
  --green:#0E9F6E;
  --green-soft:#E3F6EE;
  --amber:#B45309;
  --amber-soft:#FDF1DF;
  --cream:#A05A08;
  --cream-soft:#FBF3E4;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,27,63,.05), 0 6px 18px -10px rgba(37,99,235,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:300%;overflow-x:hidden;margin:0;padding:0;height:100%}
body{width:100%;overflow-x:hidden;margin:0;padding:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--milk);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  height:100%;overflow:hidden;display:flex;flex-direction:column;
}
h1,h2,h3{font-family:'Bricolage Grotesque','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ===== Top bar ===== */
.topbar{background:var(--card);border-bottom:1px solid var(--sky-line);position:sticky;top:0;z-index:50;overflow:visible}
.topbar-inner{
  max-width:100%;margin:0;width:100%;padding:8px 24px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--blue),var(--blue-deep));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 10px -3px rgba(37,99,235,.5);
}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:28px;font-weight:800;color:var(--blue-ink);letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand p{font-size:22px;color:var(--muted);font-weight:500;white-space:nowrap}
.crumb{font-size:20px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.crumb b{color:var(--blue-deep)}
.range-group{position:relative;margin-left:auto}
.range-pills{display:flex;gap:4px;background:var(--sky);padding:3px;border-radius:10px;flex-wrap:nowrap;}
.custom-range{
  position:absolute;top:calc(100% + 6px);right:0;z-index:60;
  display:flex;align-items:flex-end;gap:8px;
  background:var(--card);padding:12px;border:1px solid var(--sky-line);
  border-radius:12px;box-shadow:0 12px 30px -10px rgba(11,27,63,.28);
}
.custom-range[hidden]{display:none}
.cr-field{display:flex;flex-direction:column;gap:4px}
.cr-field label{font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.date-input{font:inherit;font-size:18px;color:var(--blue-ink);padding:7px 9px;border:1px solid var(--sky-line);border-radius:8px;background:var(--card);min-width:180px;}
.pill{
  font:inherit;font-size:16px;font-weight:600;color:var(--muted);
  border:none;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;transition:.15s;white-space:nowrap;font-size:13px;
}
.pill:hover{color:var(--blue-deep)}
.pill.active{background:#fff;color:var(--blue-deep);box-shadow:0 1px 4px rgba(11,27,63,.12)}
.btn{
  font:inherit;font-size:18px;font-weight:600;cursor:pointer;border-radius:9px;
  padding:7px 13px;border:1px solid var(--sky-line);background:var(--card);color:var(--blue-ink);
  transition:.15s;white-space:nowrap;text-decoration:none;display:inline-block;
}
.btn:hover{background:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}

/* ===== Hero ===== */
.hero{
  background:linear-gradient(160deg,#1E4FD6 0%,#2563EB 55%,#3B77F2 100%);
  color:#fff;position:relative;overflow:hidden;flex:none;
}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 160px at 88% -30%,rgba(255,255,255,.16),transparent 70%)}
.hero-inner{
  max-width:100%;margin:0;width:100%;padding:10px 24px 12px;position:relative;z-index:1;
}
.hero-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.hero-head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero-head .sub{font-size:16px;color:rgba(255,255,255,.78);font-weight:500}
.hero-date-row{display:flex;justify-content:flex-end;margin-bottom:6px}
.hero-date{font-size:17px;color:#fff;font-weight:700;letter-spacing:.4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{
  background:rgba(255,255,255,.97);border-radius:var(--radius);
  padding:10px 18px;box-shadow:0 8px 22px -12px rgba(6,22,68,.45);
  display:flex;align-items:center;gap:14px;
}
.kpi .ico{width:36px;height:36px;border-radius:9px;background:var(--sky);flex:none;display:grid;place-items:center;color:var(--blue)}
.kpi>div{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex:1;min-width:0}
.kpi .ico svg{width:18px;height:18px}
.kpi .tag{font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-deep);flex:1}
.kpi .value{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(28px,3vw,40px);font-weight:800;color:var(--blue-ink);letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.kpi .value small{font-size:.5em;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .meta{font-size:18px;color:var(--muted);font-weight:500}
.kpi .meta b{color:var(--text)}

/* ===== Main ===== */
.main{flex:1;max-width:100%;margin:0;width:100%;padding:20px 24px 48px;overflow-y:auto}
.section-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.section-head:first-child{margin-top:0}
.cat-tag{
  font-size:26px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);
  background:var(--sky);border-radius:99px;padding:4px 12px;white-space:nowrap;
}
.section-head h3{font-size:34px;font-weight:800;color:var(--blue-ink);letter-spacing:-.01em}
.section-head .hint{font-size:24px;color:var(--muted);font-weight:500}
.section-head .rule{flex:1;height:1px;background:var(--sky-line)}
.section-head .tot{
  font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;color:var(--blue-ink);white-space:nowrap;
}
.section-head .tot small{font-size:24px;color:var(--muted);font-weight:600}

/* Tables */
.tblcard{
  background:var(--card);border:1px solid var(--sky-line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
table{width:100%;border-collapse:collapse}
thead th{
  font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:var(--milk);text-align:center;padding:12px 0;border-bottom:1px solid var(--sky-line);white-space:nowrap;
}
/* All value columns center-aligned */
thead th.r, td.r{text-align:center}
/* …except the last column (Completed), which hugs the right edge. */
thead th:last-child, tbody td:last-child, tfoot td:last-child{text-align:center}
tbody td{
  font-size:28px;padding:14px 0;border-bottom:1px solid var(--sky-line);white-space:nowrap;text-align:center;
}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--milk)}
td .src{color:var(--text);font-weight:600}
td.kg{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--blue-ink);font-size:28px}
td.kg small,td.pc small{font-size:20px;color:var(--muted);font-weight:600;margin-left:2px}
td.pc{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--text);font-size:28px}
td .time{font-size:22px;color:var(--muted)}
.chip{
  display:inline-block;font-size:28px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap;
}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--sky);color:var(--blue-deep)}
tfoot td{
  padding:9px 0;background:var(--milk);border-top:1px solid var(--sky-line);
  font-size:24px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;
}
tfoot td.kg{font-family:'Bricolage Grotesque',sans-serif;font-size:32px;color:var(--blue-ink);text-transform:none;letter-spacing:0;text-align:center}

/* Reveal */
.reveal{opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
@media (max-width:900px){
  .kpis{grid-template-columns:1fr}
  .tblcard{overflow-x:auto}
  table{min-width:520px}
}
@media (max-width:860px){
  .topbar-inner{flex-wrap:wrap;gap:8px 12px}
  .crumb{order:5;flex-basis:100%;margin-left:0}
  .range-pills{margin-left:0}
  .hero-head h2{font-size:18px}
}
@media (max-width:640px){
  .range-pills{width:100%;justify-content:space-between;margin-left:0}
  .pill{flex:1;text-align:center;padding:6px 6px}
  .topbar-inner .btn{flex:1;text-align:center}
  .hero-inner{padding:16px 16px 18px}
  .main{padding:16px 16px 40px}
  .section-head{flex-wrap:wrap;gap:6px}
  .section-head .rule{display:none}
}
@media (max-width:560px){
  .brand p{display:none}
}

<script>
const BASE_URL = '';
const params = new URLSearchParams(window.location.search);
const dairy  = params.get('dairy') || 'bengaluru';
function dairySlug(){ return dairy === 'bengaluru' ? 'bangalore' : dairy; }
function formatIN(n){ return Number(n).toLocaleString('en-IN'); }
function num(v){ return parseFloat(v || 0); }
function fmtDate(iso){ return iso ? iso.split('T')[0] : '—'; }

function getActiveFilter(){
  const a = document.querySelector('.pill.active');
  if(!a) return 'month';
  const f = a.dataset.filter;
  if(f === 'custom'){
    const sd = document.getElementById('startDate').value;
    const ed = document.getElementById('endDate').value;
    if(!sd || !ed) return 'month';
    const st = document.getElementById('startTime').value || '00:00';
    const et = document.getElementById('endTime').value || '23:59';
    return `custom&start=${sd}&end=${ed}&startTime=${st}:00&endTime=${et}:00`;
  }
  return f || 'month';
}

async function fetchData(path, extra=''){
  try{
    const res = await fetch(`${BASE_URL}/papi/${dairySlug()}/${path}?filter=${getActiveFilter()}${extra}`);
    const json = await res.json();
    if(json && json.success && Array.isArray(json.data)) return json.data;
  }catch(e){}
  return null;
}

/* Decide which columns to show per product */
function hasFatSNF(product){ return /milk|cream|paneer/i.test(product); }

/* Net Kg for a row: NetWeight if present, else Gross − Tare. */
function rowNet(r){ return num(r.NetWeight)>0 ? num(r.NetWeight) : Math.max(0, num(r.GrossWeight)-num(r.TareWeight)); }

/* Roll DairyCode up into one of three combined sources so the section shows a
   handful of grouped rows instead of one row per raw code:
   - BMC          : any code containing "BMC" (BMC_44, BMC-7, "BMC 64", …)
   - CC           : chilling centres — codes containing "CC" ((ANEKAL CC), …)
   - Other Unions : everything else (CHIMUL, SHIMUL, other dairies, stray codes) */
function srcKey(code){
  const c = (code || '').trim();
  if(/bmc/i.test(c)) return 'BMC';
  if(/\bcc\b/i.test(c) || /cc\)/i.test(c)) return 'CC';
  return 'Other Unions';
}

/* Quantity-weighted average of `field`, weighted by each row's net Kg. Fat/SNF
   must be weighted by quantity, not a plain mean, because trucks carry very
   different volumes. Returns null when no usable rows. */
function weightedAvg(rows, field){
  let wsum = 0, w = 0;
  rows.forEach(r=>{
    const v = num(r[field]), kg = rowNet(r);
    if(v>0 && kg>0){ wsum += v*kg; w += kg; }
  });
  return w>0 ? (wsum/w).toFixed(2) : null;
}

function renderSection(product, rows, catIndex){
  const totalNet = rows.reduce((s,r)=>s+rowNet(r),0);
  const showFS   = hasFatSNF(product);
  // Section footer Fat/SNF are quantity-weighted across every truck.
  const avgFat   = weightedAvg(rows, 'Fat_First');
  const avgSNF   = weightedAvg(rows, 'SNF_First');

  const fatSnfHeaders = showFS ? '<th class="r">Avg Fat (%)</th><th class="r">Avg SNF (%)</th>' : '';
  const fatSnfFooter  = showFS
    ? `<td class="r kg">${avgFat ? avgFat+'<small>%</small>' : '—'}</td><td class="r kg">${avgSNF ? avgSNF+'<small>%</small>' : '—'}</td>`
    : '';

  /* Group into the three combined sources (BMC, CC, Other Unions). Each is one
     rolled-up row; Fat/SNF quantity-weighted. */
  const bySource = {};
  rows.forEach(r=>{
    const src = srcKey(r.DairyCode);
    if(!bySource[src]) bySource[src] = [];
    bySource[src].push(r);
  });

  // Stable display order: BMC, CC, Other Unions, then anything unexpected;
  // ties broken by truck count.
  const order = { 'BMC':0, 'CC':1, 'Other Unions':2 };
  const sortedSources = Object.entries(bySource)
    .sort((a,b)=> (order[a[0]] ?? 9) - (order[b[0]] ?? 9) || b[1].length - a[1].length);

  const sourceRows = sortedSources.map(([src, srows])=>{
    const sNet  = srows.reduce((s,r)=>s+rowNet(r),0);
    const sFat  = weightedAvg(srows, 'Fat_First');
    const sSNF  = weightedAvg(srows, 'SNF_First');
    const sDone = srows.filter(r=>r.IsCompleted).length;
    const fatSnfCells = showFS
      ? `<td class="r pc">${sFat ? sFat+'<small>%</small>' : '—'}</td><td class="r pc">${sSNF ? sSNF+'<small>%</small>' : '—'}</td>`
      : '';
    return `<tr>
      <td><span class="src">${src}</span></td>
      <td class="r kg">${srows.length}</td>
      <td class="r kg">${formatIN(Math.round(sNet))}<small>Kg</small></td>
      ${fatSnfCells}
      <td class="r"><span class="chip ${sDone===srows.length?'green':'amber'}">${sDone}/${srows.length}</span></td>
    </tr>`;
  }).join('');

  return `
  <div class="section-head reveal">
    <span class="cat-tag">Category ${catIndex}</span>
    <h3>${product}</h3>
    <b style="font-size:26px;font-weight:700">${formatIN(Math.round(totalNet))} Kg total</b>
    <span class="rule"></span>
  </div>
  <div class="tblcard reveal">
    <table>
      <thead>
        <tr>
          <th>Source</th>
          <th class="r">Trucks</th>
          <th class="r">Total Received (Kg)</th>
          ${fatSnfHeaders}
          <th class="r">Completed</th>
        </tr>
      </thead>
      <tbody>${sourceRows}</tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td class="r kg" style="padding-right:20px">${rows.length}</td>
          <td class="r kg">${formatIN(Math.round(totalNet))}<small>Kg</small></td>
          ${fatSnfFooter}
          <td class="r kg">${rows.filter(r=>r.IsCompleted).length}/${rows.length}</td>
        </tr>
      </tfoot>
    </table>
  </div>`;
}

async function loadAll(){
  let d = await fetchData('truck-entry', '&all=true');
  const main = document.getElementById('main-content');

  if(!d || !d.length){
    main.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px">No data for selected period</div>';
    return;
  }

  // Exclude Butter and Cream — they are not counted as milk received, so they
  // drop out of the Total milk received KPI and don't get their own category.
  const EXCLUDED = /^(butter|cream)$/i;
  d = d.filter(r => !EXCLUDED.test((r.ProductCode || '').trim()));
  if(!d.length){
    main.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px">No data for selected period</div>';
    return;
  }

  // KPIs
  const trucks   = d.length;
  const totalNet = d.reduce((s,r)=>s+(num(r.NetWeight)>0?num(r.NetWeight):Math.max(0,num(r.GrossWeight)-num(r.TareWeight))),0);
  const fatRows  = d.filter(r=>num(r.Fat_First)>0);
  const snfRows  = d.filter(r=>num(r.SNF_First)>0);
  const avgFat   = fatRows.length ? (fatRows.reduce((s,r)=>s+num(r.Fat_First),0)/fatRows.length).toFixed(2) : '—';
  const avgSNF   = snfRows.length ? (snfRows.reduce((s,r)=>s+num(r.SNF_First),0)/snfRows.length).toFixed(2) : '—';
  const completed = d.filter(r=>r.IsCompleted).length;

  document.getElementById('kpi-net').textContent = formatIN(Math.round(totalNet));
  document.getElementById('kpi-trucks').textContent = trucks;
  document.getElementById('kpi-trucks-meta').innerHTML = `<b>${completed}</b> completed · ${trucks-completed} pending`;
  document.getElementById('kpi-quality').innerHTML = `${avgFat}<small>% Fat</small> &nbsp;&nbsp; ${avgSNF}<small>% SNF</small>`;

  // Group by ProductCode dynamically
  const byProduct = {};
  d.forEach(r=>{
    const p = (r.ProductCode || 'Unknown').trim();
    if(!byProduct[p]) byProduct[p] = [];
    byProduct[p].push(r);
  });

  const CAT_ORDER = p => /^PAST MILK$/i.test(p) ? 2 : /^SKIM MILK POWDER$/i.test(p) ? 3 : 1;
  main.innerHTML = Object.entries(byProduct)
    .sort(([a],[b]) => CAT_ORDER(a) - CAT_ORDER(b))
    .map(([product, rows], i) => renderSection(product, rows, i+1))
    .join('');
}

function heroDateLabel(){
  const f = getActiveFilter();
  const el = document.getElementById('hero-date');
  if(!el) return;
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = d => { const x=new Date(d); return x.getDate()+' '+M[x.getMonth()]+' '+x.getFullYear(); };
  const fmtD = d => d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
  const today = new Date();
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if(f==='yesterday'){ el.textContent=fmtD(yest); }
  else if(f==='week'){ const mon=new Date(today); mon.setDate(today.getDate()-today.getDay()+(today.getDay()===0?-6:1)); el.textContent=fmtD(mon)+' – '+fmtD(today); }
  else if(f==='month'){ const s=new Date(today.getFullYear(),today.getMonth(),1); el.textContent=fmtD(s)+' – '+fmtD(today); }
  else if(f.startsWith('custom')){ const cp=new URLSearchParams(f.replace(/^custom&?/,'')); const sd=cp.get('start'),ed=cp.get('end'); if(sd&&ed) el.textContent=fmt(sd)+' – '+fmt(ed); }
}
(()=>{
  const f = new URLSearchParams(window.location.search).get('filter');
  const s = new URLSearchParams(window.location.search).get('start');
  const e = new URLSearchParams(window.location.search).get('end');
  if(f){
    document.querySelectorAll('.pill').forEach(p=>{
      const m = p.dataset.filter === f;
      p.classList.toggle('active', m);
      p.setAttribute('aria-selected', String(m));
    });
    if(f === 'custom' && s && e){
      document.getElementById('startDate').value = s;
      document.getElementById('endDate').value = e;
      const st = new URLSearchParams(window.location.search).get('startTime');
      const et = new URLSearchParams(window.location.search).get('endTime');
      if(st) document.getElementById('startTime').value = st.slice(0,5);
      if(et) document.getElementById('endTime').value = et.slice(0,5);
    }
  }
})();
heroDateLabel();
loadAll();

const customRange = document.getElementById('customRange');
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')});
    p.classList.add('active'); p.setAttribute('aria-selected','true');
    if(p.hasAttribute('data-custom')){
      customRange.hidden = !customRange.hidden;
    } else {
      customRange.hidden = true;
      loadAll();
    }
  });
});
document.getElementById('applyRange').addEventListener('click',()=>{
  const s = document.getElementById('startDate').value;
  const e = document.getElementById('endDate').value;
  if(!s || !e){ alert('Please pick both a start and end date.'); return; }
  const today = new Date().toISOString().split('T')[0];
  if(s > today){ alert('From date cannot be in the future.'); return; }
  if(e > today){ alert('To date cannot be in the future.'); return; }
  if(s > e){ alert('From date cannot be greater than To date.'); return; }
  customRange.hidden = true;
  loadAll();
});
document.addEventListener('click',ev=>{
  if(customRange.hidden) return;
  if(!customRange.contains(ev.target) && !ev.target.closest('[data-custom]')) customRange.hidden = true;
});
