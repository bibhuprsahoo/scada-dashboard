name: Deploy to OCI

on:
  push:
    branches:
      - latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            REPO=/opt/scada-dashboard
            WEB=/var/www/bangalore-dairy-dashboard

            cd "$REPO"
            sudo git fetch origin latest
            sudo git reset --hard origin/latest

            sudo cp "$REPO"/*.html "$WEB"/
            sudo cp "$REPO"/logo.png "$WEB"/ 2>/dev/null || true

            # Pre-dairy pages live in a subfolder; the root glob above does not
            # recurse, so copy them explicitly.
            sudo mkdir -p "$WEB"/predairy
            sudo cp "$REPO"/predairy/*.html "$WEB"/predairy/

            # Add this alongside your predairy copy step
            sudo mkdir -p "$WEB"/Transport-vehicle
            sudo cp "$REPO"/Transport-vehicle/* "$WEB"/Transport-vehicle/
            
            for f in "$REPO"/*.html "$REPO"/predairy/*.html; do
              rel=${f#"$REPO"/}
              if ! sudo cmp -s "$f" "$WEB/$rel"; then
                echo "DEPLOY VERIFICATION FAILED: $rel does not match repo"
                exit 1
              fi
            done

            # Pre-dairy API (union054 + digital + farmers) runs as its own systemd
            # service from /opt/procurement-api, a separate dir from this repo. The
            # steps above only touch static HTML, so the API code must be copied over
            # and the service restarted for API changes to take effect. Restart only
            # when the file actually changed, to avoid needless service bounces.
            API_SRC="$REPO/procurement-api/server.js"
            API_DST=/opt/procurement-api/server.js
            if [ -f "$API_SRC" ] && ! sudo cmp -s "$API_SRC" "$API_DST"; then
              sudo cp "$API_SRC" "$API_DST"
              sudo systemctl restart procurement-api.service
              echo "$(date --iso-8601=seconds) | procurement-api updated + restarted" | sudo tee -a /home/opc/deploy.log
            fi

            echo "$(date --iso-8601=seconds) | Deployed + verified from GitHub Actions" | sudo tee -a /home/opc/deploy.log
