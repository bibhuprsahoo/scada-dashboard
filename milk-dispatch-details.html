<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Milk Dispatch — Bangalore Main Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;
  --blue-deep:#1D4ED8;
  --blue-ink:#0B1B3F;
  --milk:#F5F8FF;
  --sky:#E8EFFD;
  --sky-line:#D5E2FA;
  --card:#FFFFFF;
  --text:#233355;
  --muted:#6B7CA3;
  --green:#0E9F6E;
  --green-soft:#E3F6EE;
  --amber:#B45309;
  --amber-soft:#FDF1DF;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,27,63,.05), 0 6px 18px -10px rgba(37,99,235,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:300%;overflow-x:hidden;margin:0;padding:0;height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--milk);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  height:100%;overflow:hidden;display:flex;flex-direction:column;
}
h1,h2,h3{font-family:'Bricolage Grotesque','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ===== Top bar ===== */
.topbar{background:var(--card);border-bottom:1px solid var(--sky-line);position:sticky;top:0;z-index:50;overflow:visible}
.topbar-inner{
  max-width:100%;margin:0;width:100%;padding:8px 24px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--blue),var(--blue-deep));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 10px -3px rgba(37,99,235,.5);
}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:28px;font-weight:800;color:var(--blue-ink);letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand p{font-size:22px;color:var(--muted);font-weight:500;white-space:nowrap}
.crumb{font-size:20px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.crumb b{color:var(--blue-deep)}
.range-group{position:relative;margin-left:auto}
.range-pills{display:flex;gap:4px;background:var(--sky);padding:3px;border-radius:10px;flex-wrap:nowrap;}
.custom-range{
  position:absolute;top:calc(100% + 6px);right:0;z-index:60;
  display:flex;align-items:flex-end;gap:8px;
  background:var(--card);padding:12px;border:1px solid var(--sky-line);
  border-radius:12px;box-shadow:0 12px 30px -10px rgba(11,27,63,.28);
}
.custom-range[hidden]{display:none}
.cr-field{display:flex;flex-direction:column;gap:4px}
.cr-field label{font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.date-input{font:inherit;font-size:18px;color:var(--blue-ink);padding:7px 9px;border:1px solid var(--sky-line);border-radius:8px;background:var(--card);min-width:180px;}
.pill{
  font:inherit;font-size:16px;font-weight:600;color:var(--muted);
  border:none;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;transition:.15s;white-space:nowrap;font-size:13px;
}
.pill:hover{color:var(--blue-deep)}
.pill.active{background:#fff;color:var(--blue-deep);box-shadow:0 1px 4px rgba(11,27,63,.12)}
.btn{
  font:inherit;font-size:18px;font-weight:600;cursor:pointer;border-radius:9px;
  padding:7px 13px;border:1px solid var(--sky-line);background:var(--card);color:var(--blue-ink);
  transition:.15s;white-space:nowrap;text-decoration:none;display:inline-block;
}
.btn:hover{background:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}

/* ===== Hero ===== */
.hero{
  background:linear-gradient(160deg,#1E4FD6 0%,#2563EB 55%,#3B77F2 100%);
  color:#fff;position:relative;overflow:hidden;flex:none;
}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 160px at 88% -30%,rgba(255,255,255,.16),transparent 70%)}
.hero-inner{
  max-width:100%;margin:0;width:100%;padding:18px 24px 22px;position:relative;z-index:1;
}
.hero-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hero-head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero-head .sub{font-size:16px;color:rgba(255,255,255,.78);font-weight:500}
.hero-date-row{display:flex;justify-content:flex-end;margin-bottom:10px}
.hero-date{font-size:17px;color:#fff;font-weight:700;letter-spacing:.4px}
.kpis{display:grid;grid-template-columns:1fr;gap:12px}
.kpi{
  background:rgba(255,255,255,.97);border-radius:var(--radius);
  padding:14px 18px;box-shadow:0 8px 22px -12px rgba(6,22,68,.45);
  display:flex;align-items:center;gap:14px;
}
.kpi .ico{width:38px;height:38px;border-radius:10px;background:var(--sky);flex:none;display:grid;place-items:center;color:var(--blue)}
.kpi .ico svg{width:20px;height:20px}
.kpi .tag{font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-deep)}
.kpi .value{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(28px,3vw,40px);font-weight:800;color:var(--blue-ink);letter-spacing:-.02em;line-height:1.15}
.kpi .value small{font-size:.5em;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .meta{font-size:18px;color:var(--muted);font-weight:500}
.kpi .meta b{color:var(--text)}

/* ===== Tank grid ===== */
.main{flex:1;max-width:100%;margin:0;width:100%;padding:20px 24px 48px;overflow-y:auto}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.section-head h3{font-size:34px;font-weight:800;color:var(--blue-ink);letter-spacing:-.01em}
.section-head .hint{font-size:24px;color:var(--muted);font-weight:500}
.section-head .rule{flex:1;height:1px;background:var(--sky-line)}
.cat-tag{
  font-size:26px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);
  background:var(--sky);border-radius:99px;padding:4px 12px;white-space:nowrap;
}
.section-head .tot{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;color:var(--blue-ink);white-space:nowrap}
.section-head .tot small{font-size:24px;color:var(--muted);font-weight:600}
.section-total{margin:4px 0 12px;padding-left:48px}
.section-total .tot{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(28px,3vw,40px);font-weight:800;color:var(--blue-ink)}
.section-total .tot small{font-size:.5em;color:var(--muted);font-weight:600;margin-left:3px}
.tanks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tank{
  background:var(--card);border:1px solid var(--sky-line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;
  transition:transform .18s,box-shadow .18s;
}
.tank:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(11,27,63,.06),0 12px 28px -14px rgba(37,99,235,.28)}
.tank-head{display:flex;align-items:center;gap:10px}
.tank-badge{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:var(--sky);display:grid;place-items:center;
  font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;color:var(--blue-deep);
}
.tank-head h3{font-size:36px;font-weight:800;color:var(--blue-ink)}
.tank-head .sub{font-size:22px;color:var(--muted);font-weight:500}
.tank .qty{
  background:var(--milk);border-radius:10px;padding:8px 12px;
}
.tank .qty .lbl{font-size:26px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tank .qty .v{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(44px,4vw,62px);font-weight:800;color:var(--muted);line-height:1.2}
.tank .qty .v small{font-size:.5em;font-weight:700;margin-left:2px}
.tank .fs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tank .fs .cell{
  border:1px dashed var(--sky-line);border-radius:9px;padding:6px 10px;
}
.tank .fs .lbl{font-size:26px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tank .fs .v{font-family:'Bricolage Grotesque',sans-serif;font-size:34px;font-weight:800;color:var(--muted)}
.tank .fs .v small{font-size:.6em;font-weight:600}
.chip{
  display:inline-block;font-size:13.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;align-self:flex-start;
}
.chip.mute{background:var(--sky);color:var(--muted)}
.chip.green{background:var(--green-soft);color:var(--green)}
.vars .lbl{font-size:17px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.vars{border:1px dashed var(--sky-line);border-radius:9px;padding:6px 10px}
.vars .vlist{display:flex;flex-wrap:wrap;gap:4px}
.vchip{display:inline-block;font-size:16px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--sky);color:var(--blue-deep);white-space:nowrap}
.vchip.empty{background:var(--sky);color:var(--muted)}
.empty-state{
  grid-column:1 / -1;
  background:var(--card);border:1px dashed var(--sky-line);border-radius:var(--radius);
  padding:40px 24px;text-align:center;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.empty-state .eico{
  width:52px;height:52px;border-radius:14px;background:var(--sky);
  display:grid;place-items:center;color:var(--blue);
}
.empty-state .eico svg{width:26px;height:26px}
.empty-state b{color:var(--text);font-size:14.5px;font-weight:700}
.empty-state span{font-size:14.5px;max-width:460px;line-height:1.6}

/* Reveal */
.reveal{opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
@media (max-width:1000px){
  .tanks{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:1fr}
}
@media (max-width:860px){
  .topbar-inner{flex-wrap:wrap;gap:8px 12px}
  .crumb{order:5;flex-basis:100%;margin-left:0}
  .range-pills{margin-left:0}
  .hero-head h2{font-size:18px}
}
@media (max-width:640px){
  .range-pills{width:100%;justify-content:space-between;margin-left:0}
  .pill{flex:1;text-align:center;padding:6px 6px}
  .topbar-inner .btn{flex:1;text-align:center}
  .hero-inner{padding:16px 16px 18px}
  .main{padding:16px 16px 40px}
}
@media (max-width:560px){
  .tanks{grid-template-columns:1fr}
  .brand p{display:none}
}
</style>

<!-- ===== Hero ===== -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-head">
      <h2>Milk Dispatch</h2>
    </div>
    
      <div class="kpis">
      <div class="kpi reveal">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v14a6 6 0 0 1-12 0Z"/><path d="M6 11h12"/></svg></span>
        <div>
          <div class="tag">Total milk dispatched</div>
          <div class="value num"><span id="kpi-net">—</span><small>Kg</small></div>
          <div class="meta"></div>

      </div>

</section>

<!-- ===== sections ===== -->
<main class="main">
  <div class="section-head reveal" style="margin-top:26px">
    <span class="cat-tag">Category 1</span>
    <h3>Milk Dispatched to Product Dairy</h3>
  </div>
  <span class="tot num" id="tot-pd" hidden></span>
  <div class="tanks" id="sec-pd"></div>

  <div class="section-head reveal" style="margin-top:26px">
    <span class="cat-tag">Category 2</span>
    <h3>Milk Dispatched to NMP (Nandini Milk Products)</h3>
  </div>
  <span class="tot num" id="tot-nmp" hidden></span>
  <div class="tanks" id="sec-nmp"></div>

</main>

<script>
/* Render RMST 1–8 cards. Wire real values into this array from your backend. */
/* DISPATCH DATA IS DYNAMIC — populate these arrays from your daily dispatch tables.
   Each entry: { name, kg, trucks, fat, snf, source }  (source: "RMST", "PMST" or "RMST + PMST")
   Example:
   viaWeighBridge: [ { name: "Kolar Union", kg: 42500, trucks: 6, fat: 3.12, snf: 8.41, source: "RMST" } ]
   productDairy / nmp: usually a single entry, e.g. { name: "Product Dairy", kg: 65000, trucks: 8, fat: 3.05, snf: 8.32, source: "PMST" } */
const dispatchData = {
  viaWeighBridge: [],
  productDairy: [],
  nmp: [],
};

// Kg values are whole numbers on screen — round before formatting so totals
// (which sum un-rounded section quantities) don't show a stray .88 tail.
function formatIN(n){ return Math.round(Number(n) || 0).toLocaleString('en-IN'); }
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('[data-count]').forEach(el=>{
  const target = parseInt(el.dataset.count,10);
  if(reduced){ el.textContent = formatIN(target); return; }
  const dur = 1000, t0 = performance.now();
  function tick(t){
    const p = Math.min((t - t0)/dur, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = formatIN(Math.round(target * eased));
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
});

function renderSection(list, wrapId, totId, emptyMsg){
  const wrap = document.getElementById(wrapId);
  if(!wrap) return {kg:0, trucks:0};
  wrap.innerHTML = '';
  let totalKg = 0, trucks = 0;
  // Reset total display
  const totEl = document.getElementById(totId);
  if(totEl){ totEl.innerHTML = '—<small> Kg</small>'; totEl.dataset.kg = 0; }
  document.getElementById('kpi-net').textContent = '—';
  if (!list.length) {
    wrap.insertAdjacentHTML('beforeend', `
      <div class="empty-state reveal">
        <div class="eico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
        </div>
        <b>No dispatches yet for this range</b>
        <span>${emptyMsg}</span>
      </div>`);
    return {kg:0, trucks:0};
  }
  list.forEach((d,i)=>{
    totalKg += d.kg || 0; trucks += d.trucks || 0;
    const kg  = d.kg  == null ? '—' : formatIN(d.kg);
    const fat = d.fat == null ? '—' : d.fat.toFixed(2);
    const snf = d.snf == null ? '—' : d.snf.toFixed(2);
    // Hide the Avg Fat / Avg SNF block entirely when both are null (e.g. a
    // combined "To Production Dairy" card where an average is meaningless).
    const showFS = !(d.fat == null && d.snf == null);
    const typesHtml = d.types && d.types.length
      ? d.types.map(t=>`<span class="vchip">${t}</span>`).join('')
      : '';
    wrap.insertAdjacentHTML('beforeend', `
      <section class="tank reveal" style="animation-delay:${i*0.04}s">
        <div class="tank-head">
          <span class="tank-badge num">${i+1}</span>
          <div>
            <h3>${d.name}</h3>
          </div>
        </div>
        <div class="qty">
          <div class="lbl">Total dispatched</div>
          <div class="v num">${kg}<small>Kg</small></div>
        </div>
        ${showFS ? `<div class="fs">
          <div class="cell"><div class="lbl">Avg Fat</div><div class="v num">${fat}<small>%</small></div></div>
          <div class="cell"><div class="lbl">Avg SNF</div><div class="v num">${snf}<small>%</small></div></div>
        </div>` : ''}
        ${typesHtml ? `<div class="vars"><div class="lbl">Product Types</div><div class="vlist">${typesHtml}</div></div>` : ''}
        <div class="vars">
          <div class="lbl">Trucks</div>
          <div class="vlist"><span class="vchip">${d.trucks == null ? '—' : d.trucks}</span></div>
        </div>
        <span class="chip green">Dispatched</span>
      </section>`);
  });
  document.getElementById(totId).innerHTML = formatIN(Math.round(totalKg)) + '<small> Kg</small>';
  document.getElementById(totId).dataset.kg = totalKg;
  // Update grand total KPI from cat1 + cat2 only
  const pdKg = parseFloat(document.getElementById('tot-pd')?.dataset.kg||0) || 0;
  const nmpKg = parseFloat(document.getElementById('tot-nmp')?.dataset.kg||0) || 0;
  document.getElementById('kpi-net').textContent = formatIN(Math.round(pdKg + nmpKg));
  return {kg:totalKg, trucks};
}

const r2 = {kg:0,trucks:0};
const r3 = {kg:0,trucks:0};
const totalTrucks = 0;

/* ============================================================
 * Live top-KPIs from the milk-dispatch-truck endpoint.
 * NOTE: the destination category sections above (Weigh Bridge /
 * Product Dairy / NMP) are NOT wired — the endpoint returns
 * DairyCode/ProductCode but there is no known code→destination
 * mapping, so those remain static empty-states for now.
 * ============================================================ */
const BASE_URL = '';
const dispParams = new URLSearchParams(window.location.search);
const dispDairy  = dispParams.get('dairy') || 'bengaluru';
function dispSlug(){ return dispDairy === 'bengaluru' ? 'bangalore' : dispDairy; }
function n2(v){ return parseFloat(v || 0); }

function getActiveFilter(){
  const a = document.querySelector('.pill.active');
  if(!a) return 'month';
  const f = a.dataset.filter;
  if(f === 'custom'){
    const sd = document.getElementById('startDate').value;
    const ed = document.getElementById('endDate').value;
    if(!sd || !ed) return 'month';
    const st = document.getElementById('startTime').value || '00:00';
    const et = document.getElementById('endTime').value || '23:59';
    return `custom&start=${sd}&end=${ed}&startTime=${st}:00&endTime=${et}:00`;
  }
  return f || 'month';
}

async function loadDispatchKpis(){
  let d = null;
  try{
    const res = await fetch(`${BASE_URL}/papi/${dispSlug()}/milk-dispatch-truck?filter=${getActiveFilter()}`);
    const json = await res.json();
    if(json && json.success && Array.isArray(json.data)) d = json.data;
  }catch(e){ /* keep placeholders */ }
  if(!d || !d.length) return;

  const net = d.reduce((s,r)=>s+n2(r.NetWeight),0);
  const completed = d.filter(r=>r.IsCompleted).length;
  const hasFat = d.some(r=>n2(r.Fat_First)>0);
  const hasSNF = d.some(r=>n2(r.SNF_First)>0);
  const fat = hasFat ? (d.reduce((s,r)=>s+n2(r.Fat_First),0)/d.length).toFixed(2) : '—';
  const snf = hasSNF ? (d.reduce((s,r)=>s+n2(r.SNF_First),0)/d.length).toFixed(2) : '—';

  // kpi-net is set by renderSection (sum of pd + nmp only)

  // Populate WB and PD sections — filter to milk ProductCodes only
  const MILK_PRODUCTS = ['RAW MILK','PAST MILK','SKIM MILK','HOMOGENISED MILK','TONED MILK','STANDARDISED MILK'];
  const isMilkType = r => MILK_PRODUCTS.includes((r.ProductCode||'').trim().toUpperCase());
  const byDairy = {};
  d.forEach(r=>{
    if(!isMilkType(r)) return;
    const raw = (r.DairyCode||'').trim();
    if(!raw || raw === '0') return;
    const key = raw.toUpperCase();
    if(!byDairy[key]) byDairy[key] = { name:raw, kg:0, trucks:0, fat:0, snf:0, n:0 };
    byDairy[key].kg += n2(r.NetWeight);
    byDairy[key].trucks++;
    byDairy[key].fat += n2(r.Fat_First);
    byDairy[key].snf += n2(r.SNF_First);
    byDairy[key].n++;
  });
  const isPD  = k => k.includes('PRE PACK') || k.includes('PRODUCT');
  const isNMP = k => k === 'NMP';
  const wb  = Object.values(byDairy).filter(x=>!isPD(x.name.toUpperCase()) && !isNMP(x.name.toUpperCase()));
  const toEntry = x => ({ name:x.name, kg:Math.round(x.kg), trucks:x.trucks, fat:x.n>0&&x.fat>0?parseFloat((x.fat/x.n).toFixed(2)):null, snf:x.n>0&&x.snf>0?parseFloat((x.snf/x.n).toFixed(2)):null, source:'BAMUL' });
  const el = document.getElementById('sec-wb'); if(el){ el.innerHTML=''; renderSection(wb.map(toEntry), 'sec-wb', 'tot-wb', 'No weigh bridge dispatches for this range.'); }
}

/* Merge dispatch rows into a single entry under `label`.
   When `mergeAll` is true (Product Dairy: Dispatch Line-N + CST To Product
   Dairy are the same physical stream), EVERY row is summed into one entry —
   quantities and trucks add up, and Fat/SNF are dropped (set null) so the
   combined card shows only Total dispatched + Trucks.
   When `mergeAll` is false (default, e.g. NMP), only the "Dispatch Line-N"
   rows are merged (Fat/SNF as quantity-weighted averages) and any other row
   is kept as its own card. */
function combineLines(rows, label, mergeAll){
  const toEntry = r => ({
    name: r.LineName,
    kg: Math.round(n2(r.TotalQty)),
    trucks: parseInt(r.Entries,10) || 0,
    fat: n2(r.AvgFat) || null,
    snf: n2(r.AvgSNF) || null,
    source: 'Batch_Log'
  });

  if(mergeAll){
    if(!rows.length) return [];
    let kg = 0, trucks = 0;
    rows.forEach(r=>{
      kg += n2(r.TotalQty);
      trucks += (parseInt(r.Entries,10) || 0);
    });
    // Fat/SNF intentionally null — combining distinct streams into one card
    // makes an average meaningless, so we hide those cells entirely.
    return [{ name: label, kg: Math.round(kg), trucks: trucks, fat: null, snf: null, source: 'Batch_Log' }];
  }

  const isLine = r => /dispatch\s*line/i.test(r.LineName || '');
  const lines  = rows.filter(isLine);
  const others = rows.filter(r => !isLine(r));

  const out = [];
  if(lines.length){
    let kg = 0, trucks = 0, fatQty = 0, fatSum = 0, snfQty = 0, snfSum = 0;
    lines.forEach(r=>{
      const q = n2(r.TotalQty);
      kg += q;
      trucks += (parseInt(r.Entries,10) || 0);
      const f = n2(r.AvgFat), s = n2(r.AvgSNF);
      if(f > 0 && q > 0){ fatSum += f * q; fatQty += q; }
      if(s > 0 && q > 0){ snfSum += s * q; snfQty += q; }
    });
    out.push({
      name: label,
      kg: Math.round(kg),
      trucks: trucks,
      fat: fatQty > 0 ? parseFloat((fatSum/fatQty).toFixed(2)) : null,
      snf: snfQty > 0 ? parseFloat((snfSum/snfQty).toFixed(2)) : null,
      source: 'Batch_Log'
    });
  }
  // keep non-dispatch-line rows as their own cards
  others.forEach(r => out.push(toEntry(r)));
  return out;
}

async function loadProductDairy(){
  let d = null;
  try{
    const res = await fetch(`${BASE_URL}/papi/${dispSlug()}/product-dispatch?filter=${getActiveFilter()}`);
    const json = await res.json();
    if(json && json.success && Array.isArray(json.data)) d = json.data;
  }catch(e){}
  const el = document.getElementById('sec-pd'); if(el) el.innerHTML='';
  if(!d || !d.length){ renderSection([], 'sec-pd', 'tot-pd', 'No product dairy transfers for this range.'); return; }
  renderSection(combineLines(d, 'To Products', true), 'sec-pd', 'tot-pd', 'No product dairy transfers for this range.');
}

function heroDateLabel(){
  const f = getActiveFilter();
  const el = document.getElementById('hero-date');
  if(!el) return;
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = d => { const x=new Date(d); return x.getDate()+' '+M[x.getMonth()]+' '+x.getFullYear(); };
  const fmtD = d => d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
  const today = new Date();
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if(f==='yesterday'){ el.textContent=fmtD(yest); }
  else if(f==='week'){ const mon=new Date(today); mon.setDate(today.getDate()-today.getDay()+(today.getDay()===0?-6:1)); el.textContent=fmtD(mon)+' – '+fmtD(today); }
  else if(f==='month'){ const s=new Date(today.getFullYear(),today.getMonth(),1); el.textContent=fmtD(s)+' – '+fmtD(today); }
  else if(f.startsWith('custom')){ const cp=new URLSearchParams(f.replace(/^custom&?/,'')); const sd=cp.get('start'),ed=cp.get('end'); if(sd&&ed) el.textContent=fmt(sd)+' – '+fmt(ed); }
}
(()=>{
  const f = new URLSearchParams(window.location.search).get('filter');
  const s = new URLSearchParams(window.location.search).get('start');
  const e = new URLSearchParams(window.location.search).get('end');
  if(f){
    document.querySelectorAll('.pill').forEach(p=>{
      const m = p.dataset.filter === f;
      p.classList.toggle('active', m);
      p.setAttribute('aria-selected', String(m));
    });
    if(f === 'custom' && s && e){
      document.getElementById('startDate').value = s;
      document.getElementById('endDate').value = e;
      const st = new URLSearchParams(window.location.search).get('startTime');
      const et = new URLSearchParams(window.location.search).get('endTime');
      if(st) document.getElementById('startTime').value = st.slice(0,5);
      if(et) document.getElementById('endTime').value = et.slice(0,5);
    }
  }
})();

const customRange = document.getElementById('customRange');
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')});
    p.classList.add('active'); p.setAttribute('aria-selected','true');
    if(p.hasAttribute('data-custom')){
      customRange.hidden = !customRange.hidden;
    } else {
      customRange.hidden = true;
      loadDispatchKpis(); loadNMP();  loadProductDairy();
    }
  });
});
document.getElementById('applyRange').addEventListener('click',()=>{
  const s = document.getElementById('startDate').value;
  const e = document.getElementById('endDate').value;
  if(!s || !e){ alert('Please pick both a start and end date.'); return; }
  const today = new Date().toISOString().split('T')[0];
  if(s > today){ alert('From date cannot be in the future.'); return; }
  if(e > today){ alert('To date cannot be in the future.'); return; }
  if(s > e){ alert('From date cannot be greater than To date.'); return; }
  customRange.hidden = true;
  loadDispatchKpis(); loadNMP();  loadProductDairy();
});
document.addEventListener('click',ev=>{
  if(customRange.hidden) return;
  if(!customRange.contains(ev.target) && !ev.target.closest('[data-custom]')) customRange.hidden = true;
});
